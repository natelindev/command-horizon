name: Release shutdown diagnostics
on:
  workflow_dispatch:
    inputs:
      headless_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/release/diagnose_shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shutdown-diagnostics
          path: build/shutdown-diagnostics/
